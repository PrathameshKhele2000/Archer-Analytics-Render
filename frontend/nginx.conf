server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # nginx's own default is 1MB, which a CSV dataset import can exceed once parsed to
  # JSON (each row repeats its field names). Matches the backend's own body-parser
  # limit in main.ts — raising only one of the two just moves the 413 to the other.
  client_max_body_size 50m;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }
  location / { try_files $uri /index.html; }
}
